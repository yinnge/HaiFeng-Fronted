name: Deploy Frontend

on:
  push:
    branches: [ "main" ] # 确保你的分支名是 main，如果是 master 请修改

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # 使用 Node 24，解决弃用警告
          cache: '' # 不在此处设置缓存，由后续步骤处理

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # 使用 pnpm 官方 action 安装 pnpm
        with:
          run_install: false # 不自动安装依赖，由后续步骤控制
          cache: true # 启用 pnpm store 缓存
          cache_dependency_path: 'pnpm-lock.yaml' # 指定锁文件路径

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile # 使用冻结锁文件模式，确保一致性

      - name: Build Project
        run: pnpm build # 递归构建所有子项目

      - name: Prepare Server Directories
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p /opt/haifeng/dist/user
            mkdir -p /opt/haifeng/dist/admin

      - name: Copy User Files via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "apps/user/dist/*"
          target: "/opt/haifeng/dist/user"
          strip_components: 2
          overwrite: true

      - name: Copy Admin Files via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "apps/admin/dist/*"
          target: "/opt/haifeng/dist/admin"
          strip_components: 2
          overwrite: true

      - name: Restart Nginx
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/haifeng
            # 仅重启 Nginx 容器，不要执行后端构建命令！
            docker compose -f docker-compose.prod.yml restart nginx
