name: Deploy Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 这里不指定 version，让它自动读取 package.json 中的版本

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: |
          # 1. 先构建共享包，生成类型定义文件
          pnpm --filter "./packages/shared" run build
          
          # 2. 再构建应用，此时 shared 已经准备好了
          pnpm --filter "./apps/*" run build

      - name: Prepare Server Directories
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p /opt/haifeng/dist/user
            mkdir -p /opt/haifeng/dist/admin

      - name: Copy User Files via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "apps/user/dist/*"
          target: "/opt/haifeng/dist/user"
          strip_components: 2
          overwrite: true

      - name: Copy Admin Files via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "apps/admin/dist/*"
          target: "/opt/haifeng/dist/admin"
          strip_components: 2
          overwrite: true

      - name: Restart Nginx
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/haifeng
            docker compose -f docker-compose.prod.yml up -d --force-recreate nginx
