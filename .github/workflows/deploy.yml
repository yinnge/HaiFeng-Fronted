name: Deploy Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # 必须在 setup-node 之前：setup-node@v5 会读取 packageManager 字段
          # 并执行 pnpm 收集环境信息，若此时 pnpm 未安装会报
          # "Unable to locate executable file: pnpm"
          version: 10.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build Project
        run: |
          # 1. 先构建共享包，生成类型定义文件
          pnpm --filter "./packages/shared" run build
          
          # 2. 再构建应用，此时 shared 已经准备好了
          pnpm --filter "./apps/*" run build

      - name: Prepare Server Directories
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p /opt/haifeng/dist/user
            mkdir -p /opt/haifeng/dist/admin

      - name: Copy User Files via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "apps/user/dist/*"
          target: "/opt/haifeng/dist/user"
          strip_components: 3
          overwrite: true

      - name: Copy Admin Files via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "apps/admin/dist/*"
          target: "/opt/haifeng/dist/admin"
          strip_components: 3
          overwrite: true

      - name: Restart Nginx
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/haifeng
            docker compose -f docker-compose.prod.yml up -d --force-recreate nginx
